  </defs>

  <rect x="0" y="0" width="512" height="512" fill="#000000"/>

  <circle cx="256" cy="256" r="150" fill="none" stroke="#1f6f34" stroke-width="14" opacity="0.7"/>

  <line x1="256" y1="76" x2="256" y2="436" stroke="#1f6f34" stroke-width="14" opacity="0.6"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#1f6f34" stroke-width="14" opacity="0.6"/>

  <path d="M256 256 L256 76 A180 180 0 0 1 436 256 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="256" y2="76" stroke="#3fb950" stroke-width="18" stroke-linecap="round"/>

  <circle cx="256" cy="256" r="196" fill="none" stroke="#3fb950" stroke-width="20"/>

